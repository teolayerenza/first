# Configuración mínima para `supabase start` / `supabase db push`.
project_id = "pocitos-lp"

[db.seed]
# `npx supabase db push --include-seed` carga las cuadras (generá el archivo con `npm run data:grid`).
enabled = true
sql_paths = ["./seed.sql"]

[api]
schemas = ["public"]
max_rows = 1000

[auth]
# Solo sesiones anónimas: no hay email, teléfono ni OAuth.
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

# El captcha (Turnstile) se activa desde el dashboard: Authentication → Attack Protection.

[functions.submit]
# El JWT se verifica dentro de la función (necesitamos created_at de la sesión).
verify_jwt = true
